name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_GLOBAL_CONFIG: ${{ github.workspace }}/.vercel-global

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@54.5.1

      - name: Restore Vercel auth
        env:
          VERCEL_AUTH_JSON: ${{ secrets.VERCEL_AUTH_JSON }}
        run: |
          mkdir -p "$VERCEL_GLOBAL_CONFIG"
          printf '%s' "$VERCEL_AUTH_JSON" > "$VERCEL_GLOBAL_CONFIG/auth.json"

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --global-config "$VERCEL_GLOBAL_CONFIG"

      - name: Build production bundle
        run: vercel build --prod --global-config "$VERCEL_GLOBAL_CONFIG"

      - name: Deploy production bundle
        run: vercel deploy --prebuilt --prod --global-config "$VERCEL_GLOBAL_CONFIG"
